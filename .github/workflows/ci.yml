name: Documentation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Проверка качества
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить структуру и ссылки
        run: python scripts/check_docs.py

      - name: Проверить Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0

      - name: Собрать сайт в строгом режиме
        run: mkdocs build --strict

  deploy:
    name: Публикация GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Опубликовать сайт
        run: mkdocs gh-deploy --force

